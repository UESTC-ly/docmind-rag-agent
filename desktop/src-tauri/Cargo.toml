[package]
name = "docmind-desktop"
version = "2.0.1"
description = "DocMind desktop application"
authors = ["DocMind contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "docmind_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "docmind-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.3.1", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "=2.7.0", features = [] }
tauri-plugin-dialog = "=2.3.0"
tauri-plugin-fs = "=2.4.0"
tauri-plugin-notification = "=2.2.0"
