services:
  postgres:
    image: postgres:16-alpine
    container_name: docmind_postgres
    environment:
      POSTGRES_USER: docmind
      POSTGRES_PASSWORD: docmind123
      POSTGRES_DB: docmind_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: docmind_redis
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: docmind_qdrant
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
